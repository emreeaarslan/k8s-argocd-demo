apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emreeaarslan/k8s-argocd-demo.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true