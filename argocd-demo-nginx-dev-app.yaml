apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nginx-dev-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emreeaarslan/k8s-argocd-demo.git
    targetRevision: main
    path: services/demo-nginx/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
