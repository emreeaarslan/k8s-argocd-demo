apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx-prod
  namespace: demo-prod
  labels:
    app: demo-nginx-prod
    env: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-nginx-prod
  template:
    metadata:
      labels:
        app: demo-nginx-prod
        env: prod
    spec:
      volumes:
        - name: html-cache
          emptyDir: {}
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
