apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emreeaarslan/k8s-argocd-demo.git
    targetRevision: main
    path: apps/demo-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
